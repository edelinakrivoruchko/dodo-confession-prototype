:root{--sf:-apple-system,'SF Pro Text','SF Pro Display',BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;--or:#FF6900;--or2:#E8550A;--deep:#C94600;--cream:#FFF1E2;--paper:#FFFAF4;--dark:#1E1A17;--mut:#7A6E66;--line:#EFE6DD;--soft:#FFF0E5;--gray:#F3F2F0;--red:#D93025}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Dodo Rounded',Arial,sans-serif;background:var(--cream);color:var(--dark);overflow:hidden}
button{font-family:inherit;border:0;cursor:pointer;background:none;color:inherit}
.top{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:20px;padding:0 32px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-size:20px}
.brand img{width:34px;height:34px;border-radius:9px}
.dots{display:flex;gap:6px;background:rgba(255,241,226,.9);padding:6px;border-radius:20px}
body.test .testnote{margin-left:auto}
.dot{height:30px;padding:0 12px;border-radius:15px;background:#fff;font-size:13px;color:var(--mut);border:1.5px solid var(--line)}
.dot.on{background:var(--or);color:#fff;border-color:var(--or)}
.tbtn{height:34px;padding:0 16px;border-radius:17px;border:1.5px solid var(--dark);font-size:14px}
.tbtn.on{background:var(--dark);color:#fff}
.stage{position:fixed;inset:64px 0 0 0;display:flex;align-items:center;justify-content:center;gap:64px}
.phonewrap{flex:none}
.phone{width:390px;height:812px;background:#111;border-radius:56px;padding:12px;box-shadow:0 30px 60px rgba(60,30,10,.25);transform-origin:0 0}
.scr{position:relative;width:100%;height:100%;background:#fff;border-radius:44px;overflow:hidden;display:flex;flex-direction:column}
.sb{font-family:var(--sf);font-weight:600;height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-size:15px;position:relative;z-index:2}
.sb .isl{position:absolute;left:50%;top:10px;width:118px;height:32px;margin-left:-59px;background:#111;border-radius:16px}
.sb .ic{display:flex;gap:6px;align-items:center}
.sb .bat{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative}
.sb .bat:after{content:'';position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.body{flex:1;overflow-y:auto;padding:4px 20px 20px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.foot{flex:none;padding:12px 20px 28px;display:flex;flex-direction:column;gap:10px;background:#fff}
.btn{height:52px;border-radius:26px;background:var(--or);color:#fff;font-size:17px;width:100%;transition:.15s}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{background:#F1E9E2;color:#B9ADA3;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--or);border:2px solid var(--or)}
.h1{font-size:28px;line-height:1.15;margin:8px 0 6px}
.sub{font-size:15px;color:var(--mut);line-height:1.35}
.lbl{font-size:15px;margin:18px 0 10px}
.card{background:var(--gray);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:15px;line-height:1.35}
.card small{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.pill{background:var(--soft);color:var(--or);border-radius:22px;height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:14px}
.back{width:36px;height:36px;border-radius:18px;background:var(--gray);font-size:20px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.toast{position:absolute;left:16px;right:16px;bottom:110px;background:var(--dark);color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.35;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:none}
/* home */
.addr{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);margin-bottom:12px}
.addr b{font-weight:400;color:var(--dark);font-size:16px}
.banner{position:relative;background:var(--or);color:#fff;border-radius:22px;padding:20px 18px;min-height:150px;overflow:hidden;text-align:left;width:100%;display:block}
.banner .t{font-size:24px;line-height:1.1;width:62%}
.banner .s{font-size:14px;margin-top:8px;width:58%;opacity:.95;line-height:1.3}
.banner img{position:absolute;right:-28px;bottom:-30px;width:170px;transform:rotate(-12deg)}
.banner .tag{display:inline-block;margin-top:12px;background:#fff;color:var(--or);border-radius:14px;padding:5px 12px;font-size:13px}
.tabs{display:flex;gap:8px;margin:18px 0 12px}
.tabs span{padding:8px 14px;border-radius:18px;background:var(--gray);font-size:14px}
.tabs span.on{background:var(--dark);color:#fff}
.prod{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prod img,.prod .ph{width:84px;height:84px;flex:none;object-fit:contain}
.prod .ph{border-radius:42px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--or);font-size:13px}
.prod .n{font-size:16px}
.prod .d{font-size:13px;color:var(--mut);margin:3px 0 8px;line-height:1.3}
.prod .p{display:inline-block;background:var(--soft);color:var(--deep);border-radius:14px;padding:5px 12px;font-size:14px}
.tabbar{flex:none;height:76px;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;font-size:11px;color:var(--mut)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9A8F87}
.tabbar i{width:22px;height:22px;border-radius:7px;background:#E4DDD6;display:block}
.tabbar div.on{color:var(--or)} .tabbar .on i{background:var(--or)}
/* lock */
.lock{background:linear-gradient(160deg,#3A2A22,#14100E);color:#fff}
.lock .sb{color:#fff}
.lock .date,.lock .clock,.notif,.lock .hint{font-family:var(--sf)}
.lock .clock{font-weight:600}
.lock .date{font-weight:500;text-align:center;font-size:17px;opacity:.85;margin-top:30px}
.lock .clock{text-align:center;font-size:84px;line-height:1;margin:6px 0 40px;letter-spacing:-1px}
.notif{display:flex;gap:12px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);border-radius:20px;padding:13px 14px;text-align:left;width:100%;color:#fff;margin-bottom:10px}
.notif img{width:38px;height:38px;border-radius:9px;flex:none}
.notif .m{font-size:12px;opacity:.75;display:flex;justify-content:space-between}
.notif .t{font-weight:600;font-size:15px;margin:2px 0}
.notif .x{font-size:14px;opacity:.9;line-height:1.3}
.notif.new{background:rgba(255,255,255,.26);animation:pop .5s ease}
@keyframes pop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.lock .hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:13px;opacity:.6}
/* video */
.vidscr{background:#0F0C0A;color:#fff}
.vidscr .sb{color:#fff}
.vtop{display:flex;justify-content:space-between;align-items:center;padding:0 18px 10px;font-size:16px}
.vtop button{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
.vf{position:relative;margin:0 14px;flex:1;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#5A463B,#2A1F19 70%)}
.vf .sil{position:absolute;left:50%;top:18%;width:200px;margin-left:-100px}
.vf .sil.blur{filter:blur(16px)}
.vf .mask{position:absolute;left:50%;top:21%;width:116px;height:116px;margin-left:-58px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.vf .rec{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:6px;font-size:14px;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:12px}
.vf .rec i{width:9px;height:9px;border-radius:5px;background:#FF3B30;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.vf .bar{position:absolute;left:14px;right:14px;bottom:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.vf .bar i{display:block;height:100%;width:0;background:var(--or);border-radius:3px;transition:width .9s linear}
.masks{display:flex;gap:8px;justify-content:center;margin:12px 0 6px}
.masks button{padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;font-size:14px}
.masks button.on{background:#fff;color:var(--dark)}
.vctl{display:flex;align-items:center;justify-content:center;gap:24px;padding:8px 0 26px;min-height:96px}
.recbtn{width:72px;height:72px;border-radius:36px;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.recbtn i{width:54px;height:54px;border-radius:27px;background:#FF3B30;transition:.2s}
.recbtn.on i{width:28px;height:28px;border-radius:7px}
.vnote{text-align:center;font-size:13px;opacity:.7;padding:0 30px}
.vatt{width:100%;margin-top:12px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--soft);font-size:14px;text-align:left}
.vatt .th{width:46px;height:46px;border-radius:12px;background:#2A1F19;display:flex;align-items:center;justify-content:center;flex:none}
.vatt .th img{width:30px;height:30px;border-radius:8px}
.vatt small{display:block;color:var(--mut);font-size:12px}
/* share */
.shcard{background:var(--or);color:#fff;border-radius:22px;padding:18px;margin:6px 0 16px;text-align:left}
.shcard .lg{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9}
.shcard .lg img{width:24px;height:24px;border-radius:6px}
.shcard .qq{font-size:19px;line-height:1.3;margin:14px 0}
.shcard small{font-size:12px;opacity:.85}
.shrow{display:flex;justify-content:space-around;margin-bottom:10px}
.shrow button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--dark)}
.shrow i{width:54px;height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:15px}
/* tracker */
.trk{display:flex;justify-content:space-between;margin:12px 0 6px;font-size:12px;color:var(--mut)}
.trk span{flex:1;text-align:center;position:relative;padding-top:14px}
.trk span:before{content:'';position:absolute;top:0;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:5px;background:#E2DAD2}
.trk span.on{color:var(--dark)} .trk span.on:before{background:var(--or)}
/* confession */
.when{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.when button{padding:9px 13px;border-radius:18px;background:var(--gray);font-size:14px}
.when button.on{background:var(--dark);color:#fff}
.attach{width:100%;margin-top:10px;text-align:left;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--line);font-size:14px;color:var(--deep);display:flex;justify-content:space-between;align-items:center}
.attach.on{border:1.5px solid var(--or);background:var(--soft);color:var(--dark)}
.attach small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sheet{position:absolute;inset:0;background:rgba(30,26,23,.45);z-index:10;display:flex;align-items:flex-end}
.sheet .in{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:18px 18px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#E2DAD2;margin:0 auto 14px}
.ord{display:block;width:100%;text-align:left;background:var(--gray);border-radius:16px;padding:12px 14px;margin-top:8px;font-size:15px;line-height:1.3}
.ord small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.req{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.35}
.req b{font-weight:400;color:#2DB34A}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:10px 14px;border-radius:20px;border:1.5px solid var(--line);font-size:14px;background:#fff}
.chip.on{border-color:var(--or);background:var(--soft);color:var(--deep)}
textarea{width:100%;height:120px;margin-top:14px;border-radius:16px;border:1.5px solid var(--line);padding:14px;font:inherit;font-size:15px;resize:none;outline:none;line-height:1.35}
textarea:focus{border-color:var(--or)}
.cnt{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px}
.cnt{gap:10px;line-height:1.35}.cnt #cc{white-space:nowrap}
.err{color:var(--red);font-size:13px;line-height:1.35;margin-top:8px;display:none}
.err.show{display:block}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--gray);margin-top:12px;font-size:15px}
.row small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:15px;background:#D8D0C8;position:relative;flex:none;transition:.2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:.2s}
.sw.on{background:var(--or)} .sw.on:after{left:23px}
.vid{width:100%;margin-top:12px;height:46px;border-radius:16px;border:1.5px dashed var(--or);color:var(--or);font-size:15px}
/* accepted */
.tss{text-align:center;padding-top:40px}
.tss .big{font-size:64px;color:var(--or);line-height:1}
.tss .h1{font-size:30px}
.gift{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:20px;padding:14px;margin-top:28px;text-align:left}
.gift img{width:76px;height:76px;object-fit:contain;flex:none}
.gift b{font-weight:400;font-size:17px;display:block}
.gift small{font-size:13px;color:var(--mut);line-height:1.3}
/* sets */
.set{display:block;width:100%;text-align:left;border:2px solid transparent}
.set.on{border-color:var(--or);background:var(--soft)}
.set .pr{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:15px}
/* cart */
.ci{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci img,.ci .ph{width:56px;height:56px;object-fit:contain;flex:none}
.ci .ph{border-radius:28px;background:var(--soft)}
.ci .n{flex:1;font-size:15px;line-height:1.3}
.ci .n small{display:block;color:var(--mut);font-size:13px}
.qty{display:flex;align-items:center;gap:10px;background:var(--gray);border-radius:16px;padding:4px}
.qty button{width:26px;height:26px;border-radius:13px;background:#fff;font-size:16px}
.ci.gift2{background:var(--soft);border-radius:16px;padding:12px;border:0;margin-top:10px}
.ci.off{opacity:.5}
.warn{background:#FFF4D6;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.35;margin-top:10px}
.warn button{color:var(--or);text-decoration:underline;font-size:14px}
.tot{display:flex;justify-content:space-between;font-size:18px;margin-top:16px}
/* checkout */
.f{background:var(--gray);border-radius:16px;padding:12px 16px;margin-top:10px}
.f small{display:block;color:var(--mut);font-size:13px}
.f div{font-size:16px;margin-top:2px}
.f.g{background:var(--soft)}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
/* done */
.ok{width:84px;height:84px;border-radius:42px;background:#2DB34A;color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center;margin:34px auto 16px}
.prog{height:10px;border-radius:5px;background:var(--gray);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--or);border-radius:5px}
/* feed */
.post{background:var(--gray);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.post .q{font-size:16px;line-height:1.35}
.post .meta{display:flex;gap:8px;margin-top:10px;align-items:center;font-size:13px;color:var(--mut)}
.react{padding:6px 10px;border-radius:14px;background:#fff;font-size:13px;color:var(--dark)}
.react.on{background:var(--or);color:#fff}
.post.mine{background:var(--soft);border:1.5px dashed var(--or)}
.seg{display:flex;background:var(--gray);border-radius:14px;padding:4px;margin:12px 0}
.seg span{flex:1;text-align:center;padding:8px;border-radius:10px;font-size:14px}
.seg span.on{background:#fff}
/* info panel */
.info{width:440px;flex:none}
.info .num{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--deep)}
.info h2{font-weight:400;font-size:44px;line-height:1.05;margin:8px 0 14px}
.info p{font-size:18px;line-height:1.45;color:#4A3F38}
.blk{background:#fff;border-radius:18px;padding:14px 18px;margin-top:12px}
.blk span{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.blk div{font-size:17px;line-height:1.35}
.blk.e{background:#FDECEA} .blk.e span{color:#C5221F} .blk.e div{color:#B3261E}
.nav{display:flex;gap:10px;margin-top:20px}
.nav button{height:44px;padding:0 20px;border-radius:22px;border:1.5px solid var(--dark);font-size:15px}
body.test .info,body.test .dotsbar{display:none}
.brand{flex-direction:row;line-height:1.2}
.brand .tt{display:flex;flex-direction:column;gap:2px}
.brand .tt small{font-size:12px;color:var(--mut)}
.scn{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.scn select{height:34px;border-radius:17px;border:1.5px solid var(--line);padding:0 12px;font:inherit;font-size:14px;background:#fff;color:var(--dark)}
.top{height:76px}
.stage{inset:128px 0 0 0;gap:48px;padding:14px 0 16px}
body.test .stage{inset:76px 0 0 0}
.dotsbar{position:fixed;top:78px;height:46px;align-items:center;left:0;right:0;display:flex;justify-content:center;z-index:4}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.where{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;line-height:1.35;min-width:260px;text-align:center}
.where small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.where.err{border-color:#F1B2B4;color:var(--red)}
.outside{display:flex;flex-direction:column;gap:8px}
.out{text-align:left;border:1.5px dashed #C9B8A8;border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.6);font-size:14px;line-height:1.35;max-width:300px}
.out:hover{background:#fff;border-color:var(--or)}
.out small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.pushbn{font-family:var(--sf);position:absolute;top:52px;left:10px;right:10px;z-index:8;display:flex;gap:10px;background:rgba(30,26,23,.92);color:#fff;border-radius:18px;padding:12px;text-align:left;animation:pop .4s ease}
.pushbn img{width:34px;height:34px;border-radius:8px;flex:none}
.pushbn small{display:block;font-size:11px;opacity:.7}
.pushbn div{font-size:14px;line-height:1.3}
.burnt{background:var(--gray);color:var(--mut)}
.errscr{text-align:center;padding-top:60px}
.errscr .ic{width:84px;height:84px;border-radius:42px;background:#FDECEA;color:var(--red);font-size:42px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}

.testnote{display:none;font-size:14px;color:var(--mut)}
body.test .testnote{display:block}

.mbtn,.mdrawer,.brand .tt .short{display:none}
.brand .ttl{font-weight:400}
@media (max-width:760px){
 body{overscroll-behavior:none}
 .top{height:52px;padding:0 12px;gap:10px;background:var(--cream);border-bottom:1px solid var(--line)}
 .brand{font-size:15px;gap:8px;min-width:0}
 .brand img{width:30px;height:30px;border-radius:8px}
 .brand .tt{min-width:0;gap:1px}
 .brand .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .brand .tt .full{display:none}
 .brand .tt .short{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .brand .tbrand{display:none}
 .scn,.top>[data-act=restart],#testBtn,.testnote,body.test .testnote{display:none!important}
 .mbtn{display:block;margin-left:auto;flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--dark);color:#fff;font-size:14px}
 .dotsbar,.stage .info,.where{display:none!important}
 .stage,body.test .stage{inset:52px 0 0 0;padding:0;gap:0;flex-direction:column;align-items:stretch;justify-content:flex-start}
 .outside{order:-1;flex:none;gap:0}
 .out{max-width:none;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 16px;background:#fff}
 .col{flex:1;min-height:0;gap:0;align-items:stretch}
 .phonewrap{flex:1;min-height:0;width:auto!important;height:auto!important}
 .phone{width:100%;height:100%;padding:0;border-radius:0;box-shadow:none;transform:none!important;background:#fff}
 .scr{border-radius:0}
 .sb{display:none}
 .body{padding-top:12px;overscroll-behavior:contain}
 .pushbn{top:10px}
 .lock .date{margin-top:40px}
 .foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
 .tabbar{height:auto;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
 .vtop{padding-top:10px}
 .vctl{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
 textarea{font-size:16px}
 body.menu .mdrawer{display:block;position:fixed;top:52px;left:0;right:0;bottom:0;z-index:20;background:var(--cream);overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
 .mdrawer .mnote{font-size:13px;color:var(--mut);line-height:1.35}
 .mdrawer .mrow{display:flex;gap:8px;margin:14px 0}
 .mdrawer select{flex:1;min-width:0;height:40px;border-radius:20px;border:1.5px solid var(--line);padding:0 12px;font:inherit;font-size:16px;background:#fff;color:var(--dark)}
 .mdrawer .tbtn{height:40px;border-radius:20px;flex:none}
 .mdots{display:flex;flex-wrap:wrap;gap:6px}
 .minfo{width:auto;margin-top:18px}
 .minfo h2{font-size:30px}
 .minfo p{font-size:16px}
}
</style>
</head>

 <div class="ok">✓</div><div class="h1">Заказ уже готовят</div><div class="sub">Курьер приедет через 35–45 минут. Признание на проверке, скоро попадёт на Стол признаний</div>
 <div class="card" style="text-align:left;margin-top:24px">Заказ № 2741<small>Готовим в пиццерии на Мичуринском проспекте, 36</small><div class="trk"><span class="on">Принят</span><span class="on">Готовим</span><span>В пути</span><span>У двери</span></div></div>

feed(){const posts=[
  ['p1','«Сказал курьеру, что жду гостей. Гостей не было»',1240],
  ['p2','«Три пиццы в одну ночь. Без сожалений»',980],
  ['p3','«Заказала одну колу. Курьер был в шоке»',715],
  ['p4','«Заказал из Додо, который на первом этаже моего дома. Курьер шёл 40 секунд»',512],
  ['p5','«Выносила мусор ночью, чтобы соседи не видели коробки»',388]];
 const fresh=[
  ['n1','«Заказал пиццу на работу и сказал коллегам, что это на всех. Съел три куска, пока они были на созвоне»',4,'6 минут назад'],
  ['n2','«Взяла одну колу в два ночи. Курьер спросил, всё ли у меня хорошо»',11,'20 минут назад'],
  ['n3','«Заказал Додстер, когда в холодильнике стоял ужин от мамы»',7,'45 минут назад'],
  ['n4','«Прятала коробки в шкаф, пока не придёт сосед по комнате»',19,'1 час назад']];
 const list=S.feedTab==='new'?fresh:posts;
 return `${sb()}<div class="body">${backBtn(S.feedFrom==='done'?8:2)}
 <div class="h1">Стол признаний</div><div class="seg"><span class="${S.feedTab==='top'?'on':''}" data-tab="top">Топ недели</span><span class="${S.feedTab==='new'?'on':''}" data-tab="new">Новые</span></div>
 ${S.mine?`<div class="post mine"><div class="q">${mineQ()}</div><div class="meta">${S.chip?S.chip+' · ':''}${S.order?'заказ '+ORDERS.find(x=>x.id===S.order).d.split(',')[0]+' · ':(S.when?S.when.toLowerCase()+' · ':'')}${S.video?'видео 0:'+String(S.video.sec).padStart(2,'0')+' · ':''}${S.approved?'Твоё признание · уже на Столе · 3 реакции':'Твоё признание · на проверке'}</div></div>`:''}
 ${list.map(([id,q,n,tm])=>{const r=S.reacted[id];return `<div class="post"><div class="q">${q}</div><div class="meta"><button class="react ${r?'on':''}" data-react="${id}">Было такое · ${(n+(r?1:0)).toLocaleString('ru-RU')}</button><span>${tm?tm+' · ':''}Анонимно</span></div></div>`}).join('')}
 </div>${S.feedFrom==='invite'?'<div class="foot"><button class="btn" data-go="3">Я тоже признаюсь</button></div>':''}`}
};
function mineQ(){return S.text.trim()?'«'+esc(S.mine)+'»':'▶ Видео-исповедь, 0:'+String(S.video.sec).padStart(2,'0')}
function shareHtml(){const q=S.mine||'Заказала одну колу и сделала вид, что жду друзей';return `<div class="sheet" data-act="closeshare"><div class="in"><div class="grab"></div><div style="font-size:18px;margin-bottom:10px">Поделиться признанием</div>
 <div class="shcard"><div class="lg"><img src="${IMG.logo}">Додо-признание</div><div class="qq">${S.mine?mineQ():'«'+esc(q)+'»'}</div><small>Анонимно · Стол признаний</small></div>
 <div class="shrow"><button data-shto="Telegram"><i style="background:#2AABEE">TG</i>Telegram</button><button data-shto="ВКонтакте"><i style="background:#0077FF">VK</i>ВКонтакте</button><button data-shto="link"><i style="background:var(--dark)">🔗</i>Ссылка</button></div>
 <div class="sub" style="text-align:center;font-size:13px">Имя в карточке не видно</div></div></div>`}
function ph(c){return {'Ночной заказ':'Во сколько заказал(а) и что было в заказе? Кто открыл дверь курьеру?','На одного, как на компанию':'Сколько всего было и что ты сказал(а) курьеру?','Одна мелочь':'Что это была за мелочь и как отреагировал курьер?','Из кафе в своём доме':'Сколько метров ехал курьер и почему не спустился сам?','Прятал упаковки':'От кого прятал(а) и куда в итоге делись коробки?'}[c]}
function txtOk(){return S.text.trim().length>=MINTXT}
function canSend(){return (txtOk()||S.video)&&(S.when||S.order)}
function hintTxt(){const n=MINTXT-S.text.trim().length;const parts=[];if(n>0&&!S.video)parts.push(`Ещё ${n} ${n%10===1&&n%100!==11?'символ':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'символа':'символов')} — расскажи подробнее`);if(!(S.when||S.order))parts.push('Отметь, когда это было');return parts.join(' · ')}
function sheetHtml(){const list=S.scn==='nohist'?'<div class="sub" style="padding:10px 2px">Прошлых заказов пока нет. Просто отметь, когда это было</div>':ORDERS.map(o=>`<button class="ord" data-ord="${o.id}">${o.d} · ${rub(o.sum)}<small>${o.items}</small></button>`).join('');return `<div class="sheet" data-act="closesheet"><div class="in"><div class="grab"></div><div style="font-size:18px">Какой заказ был неловким?</div>${list}</div></div>`}
function setCard(s){const tot=Object.entries(s.items).reduce((a,[k,q])=>a+MENU[k].p*q,0);return `<button class="card set ${S.set===s.id?'on':''}" data-set="${s.id}"><div>${s.t}</div><small>${s.d}</small><div class="pr"><span>${rub(tot)}</span><span style="color:var(--or)">${S.set===s.id?'Выбрано':'Выбрать'}</span></div></button>`}
function esc(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const BAD=/(бля|хуй|хуё|пизд|ёб|еба|ебл|сука|мудак|залуп)/i;
const PERS=/(\+?\d[\d\s\-()]{8,}\d|@\w|ул\.|улица|кв\.|квартира|дом\s*\d)/i;

function render(){
 const st=STEPS[S.step];
 const scr=$('#scr');
 scr.className='scr'+(st.k==='push'?' lock':st.k==='video'?' vidscr':'');
 scr.innerHTML=R[st.k]();
 const scrN=st.num.replace('Шаг','Экран');
 $('#where').innerHTML=`<small>Сейчас на экране</small>${scrN} · ${st.t}`;$('#where').classList.toggle('err',!!st.isErr);
 const outs=[];
 if(st.k==='done'&&!S.pushMsg&&!S.approved)outs.push({k:'Проходит 15 минут',t:'Модератор проверяет признание',act:'time'});
 if(st.k==='push')outs.push({k:'Вне телефона',t:'20:47, человек дома думает, не заказать ли чего-нибудь',act:'none'});
 $('#outside').innerHTML=outs.map(o=>`<button class="out" data-act="${o.act}"><small>${o.k}</small>${o.t}</button>`).join('');
 $('#dots').innerHTML=STEPS.slice(0,10).map((s,i)=>`<button class="dot ${i===S.step?'on':''}" data-jump="${i}">${s.dot}</button>`).join('');
 $('#info').innerHTML=`<div class="num">${st.num}</div><h2>${st.t}</h2><p>${st.does}</p>
  <div class="blk"><span>Нажимает</span><div>${st.tap}</div></div>
  <div class="blk"><span>Что дальше</span><div>${st.next}</div></div>
  <div class="blk e"><span>Ошибка или пустой результат</span><div>${st.err}</div></div>
`;
 if(st.k==='confess')bindTa();
}
function setMenu(v){document.body.classList.toggle('menu',v);$('#mBtn').textContent=v?'Закрыть':'Шаги';if(v)buildDrawer()}
function buildDrawer(){$('#mdrawer').innerHTML=`<div class="mnote">Учебный прототип: фича придумана для учебного проекта и не связана с Додо Пиццей</div><div class="mrow"><select id="mScn" aria-label="Сценарий">${$('#scnSel').innerHTML}</select><button class="tbtn" data-act="restart">Сначала</button></div><div class="mdots">${$('#dots').innerHTML}</div><div class="info minfo">${$('#info').innerHTML}</div>`;$('#mScn').value=S.scn}
function go(i){setMenu(false);S.step=+i;if([2,3,4,5,6,7,8].includes(S.step))startTimer();if(S.step>=6&&!S.cart)S.cart={...SETS.find(x=>x.id===S.set).items};render();$('#scr .body')&&($('#scr .body').scrollTop=0)}
function bindTa(){const ta=$('#ta');ta.addEventListener('input',()=>{S.text=ta.value;$('#cc').textContent=ta.value.length+' / 300';$('#hint').textContent=hintTxt();$('#cf').disabled=!canSend();$('#err').classList.remove('show')})}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-act],[data-jump],[data-chip],[data-set],[data-q],[data-react],[data-when],[data-ord],[data-mask],[data-tab],[data-shto]');if(!t)return;
 if(t.dataset.jump!==undefined){if(+t.dataset.jump===9)S.feedFrom='invite';return go(t.dataset.jump)}
 if(t.dataset.go!==undefined)return go(t.dataset.go);
 if(t.dataset.chip){S.chip=S.chip===t.dataset.chip?null:t.dataset.chip;render();$('#ta').focus();return}
 if(t.dataset.mask){S.vid.mask=t.dataset.mask;return render()}
 if(t.dataset.tab){S.feedTab=t.dataset.tab;return render()}
 if(t.dataset.shto){S.share=false;render();return toast(t.dataset.shto==='link'?'Ссылка на карточку скопирована':'Открываем '+t.dataset.shto+'. Карточка уже прикреплена')}
 if(t.dataset.when){S.when=t.dataset.when;S.order=null;render();return}
 if(t.dataset.ord){S.order=t.dataset.ord;S.when=null;S.sheet=false;render();return}
 if(t.dataset.set){S.set=t.dataset.set;render();return}
 if(t.dataset.q){const[k,d]=t.dataset.q.split(':');S.cart[k]=Math.max(0,(S.cart[k]||0)+ +d);if(!S.cart[k])delete S.cart[k];render();return}
 if(t.dataset.react){S.reacted[t.dataset.react]=!S.reacted[t.dataset.react];render();return}
 const a=t.dataset.act;
 if(a==='mmenu')return setMenu(!document.body.classList.contains('menu'));
 if(a==='banner'||a==='push')return go(2);
 if(a==='menu')return toast('В прототипе работает баннер «Додо-признание»');
 if(a==='read'){S.feedFrom='invite';return go(9)}
 if(a==='feed8'){S.feedFrom='done';return go(9)}
 if(a==='anon'){S.anon=!S.anon;render();return}
 if(a==='video'){S.vid={st:'idle',sec:0,mask:S.vid.mask};return go(11)}
 if(a==='vclose'){stopRec();return go(3)}
 if(a==='vrec'){if(S.vid.st==='rec'){stopRec();S.vid.st='done';return render()}S.vid.st='rec';S.vid.sec=0;render();window._rec=setInterval(()=>{S.vid.sec++;const vt=$('#vt'),vp=$('#vp');if(vt)vt.textContent='0:'+String(S.vid.sec).padStart(2,'0')+' / 0:15';if(vp)vp.style.width=(S.vid.sec/15*100)+'%';if(S.vid.sec>=15){stopRec();S.vid.st='done';render()}},1000);return}
 if(a==='vretake'){S.vid.st='idle';S.vid.sec=0;return render()}
 if(a==='vattach'){S.video={sec:Math.max(1,S.vid.sec),mask:S.vid.mask};return go(3)}
 if(a==='unvideo'){S.video=null;return render()}
 if(a==='closeshare'){if(e.target!==t)return;S.share=false;return render()}
 if(a==='sheet'){S.sheet=true;return render()}
 if(a==='closesheet'){if(e.target!==t)return;S.sheet=false;return render()}
 if(a==='detach'){S.order=null;return render()}
 if(a==='confess'){const v=S.text.trim()||('Видео-исповедь · 0:'+String(S.video.sec).padStart(2,'0'));if(!canSend())return;if(BAD.test(v)||PERS.test(v)){$('#err').classList.add('show');return}S.mine=v;if(S.rewrite){S.rewrite=false;S.approved=false;S.feedFrom='done';toast('Отправили на проверку ещё раз');return go(9)}if(S.scn==='offline'&&!S.offlineDone)return go(10);return go(4)}
 if(a==='resend'){S.offlineDone=true;return go(4)}
 if(a==='sbp'){S.payFailed=true;S.paying=true;go(7);setTimeout(()=>{S.paying=false;go(8)},1200);return}
 if(a==='none')return;
 if(a==='time'){S.pushMsg=S.scn==='moder'?'Признание не прошло проверку: в нём есть имя курьера. Перепиши, и оно появится на Столе':'Признание прошло проверку и уже на Столе признаний';return render()}
 if(a==='pushbn'){const m=S.scn==='moder';S.pushMsg=null;if(m){S.rewrite=true;return go(3)}S.approved=true;S.feedFrom='done';return go(9)}
 if(a==='tocart'){S.cart={...SETS.find(s=>s.id===S.set).items};return go(6)}
 if(a==='pay'){if(S.paying)return;S.paying=true;render();setTimeout(()=>{S.paying=false;go(S.scn==='payfail'&&!S.payFailed?12:8)},1200);return}
 if(a==='share'){S.share=true;return render()}
 if(a==='restart')return restart();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){toggleTest(false);setMenu(false)}});
function stopRec(){clearInterval(window._rec)}
function restart(){stopRec();Object.assign(S,{vid:{st:'idle',sec:0,mask:'dodo'},video:null,share:false,feedTab:'top',when:null,order:null,sheet:false,timerEnd:null,text:'',chip:null,anon:true,set:S.scn==='nohist'?'three':S.scn==='small'?'cola':'repeat',cart:null,mine:null,reacted:{},approved:false,offlineDone:false,payFailed:false,pushMsg:null,rewrite:false,paying:false});go(0)}
document.getElementById('scnSel').addEventListener('change',e=>{S.scn=e.target.value;restart()});
function toggleTest(v){document.body.classList.toggle('test',v);const on=document.body.classList.contains('test');$('#testBtn').classList.toggle('on',on);$('#testBtn').textContent=on?'Выйти из теста':'Режим теста';fit()}
$('#testBtn').onclick=()=>toggleTest();
setInterval(()=>document.querySelectorAll('.tm').forEach(e=>e.textContent=left()),1000);
const MQ=matchMedia('(max-width:760px)');
MQ.addEventListener('change',()=>{setMenu(false);fit()});
document.addEventListener('change',e=>{if(e.target.id==='mScn'){S.scn=e.target.value;$('#scnSel').value=S.scn;restart()}});
function fit(){const p0=$('#phone');if(MQ.matches){p0.style.transform='';p0.parentElement.style.width='';p0.parentElement.style.height='';return}const st=document.querySelector('.stage');const h=st.clientHeight-30-62;const sc=Math.min(1,h/812);const p=$('#phone');p.style.transform=`scale(${sc})`;p.parentElement.style.width=390*sc+'px';p.parentElement.style.height=812*sc+'px'}
addEventListener('resize',fit);fit();render();
</script>
</body>
